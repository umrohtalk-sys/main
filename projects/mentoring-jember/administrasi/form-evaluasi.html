<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluasi Mentoring Claude</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<!-- FORM EVALUASI SETELAH MENTORING · dikirim H+0 malam atau H+1. Jawaban dikirim peserta lewat WhatsApp. -->
<style>
:root{--bg:#FBF7EE;--surf:#fff;--soft:#FDEADB;--line:#EADFC8;--ink:#191512;--body:#4A4136;--muted:#6E6353;--acc:#F05323;--deep:#C23A12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110E;--surf:#211B16;--soft:#3A2216;--line:#3B3129;--ink:#F6EEE2;--body:#DCCFBE;--muted:#AA9C89;--acc:#FF6A3B;--deep:#FF8E64;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110E;--surf:#211B16;--soft:#3A2216;--line:#3B3129;--ink:#F6EEE2;--body:#DCCFBE;--muted:#AA9C89;--acc:#FF6A3B;--deep:#FF8E64;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font:16px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
.w{max-width:680px;margin:auto;padding:24px 16px 110px}
.k{font:500 12px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
h1{font:900 clamp(30px,6vw,40px)/1.05 'Outfit';color:var(--ink);margin:8px 0 10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}
.q{font-weight:700;color:var(--ink);margin:0 0 10px;display:block}
.skala{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.skala label{text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0;cursor:pointer;font:800 18px 'Outfit';color:var(--ink)}
.skala input,.nps input{position:absolute;opacity:0;pointer-events:none}
.skala label:has(input:checked),.nps label:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps label{text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;cursor:pointer;font:800 15px 'Outfit';color:var(--ink)}
textarea,input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:76px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);padding:9px 12px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--ink)}
.opts label:has(input:checked){border-color:var(--acc);background:var(--soft)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:12px 16px}
.bar .in{max-width:680px;margin:auto;display:flex;gap:8px}
button{font:800 15px 'Plus Jakarta Sans';border:0;border-radius:12px;padding:13px 16px;cursor:pointer}
.wa{background:#25D366;color:#fff;flex:1}.b2{background:var(--soft);color:var(--deep)}
@media print{.bar{display:none}}
</style>
</head>
<body>
<div class="w">
  <span class="k">Mentoring Claude 1-on-1 · Jember</span>
  <h1>Evaluasi setelah mentoring</h1>
  <p>Terima kasih sudah ikut! Isi 2 menit. Masukanmu membuat sesi berikutnya lebih baik.</p>
  <form id="f" onsubmit="return false">
    <div class="card"><label class="q" for="nama">Nama & tanggal sesi</label><input type="text" id="nama" placeholder="mis. Rina, 28 Nov"></div>
    <div id="sk"></div>
    <div class="card"><span class="q">Seberapa mungkin kamu merekomendasikan mentoring ini ke teman? (0–10)</span><div class="nps" id="nps"></div><div class="ends"><span>Tidak mungkin</span><span>Sangat mungkin</span></div></div>
    <div class="card"><label class="q">Karyamu sekarang</label><div class="opts" data-n="Status karya"><label><input type="radio" name="st" value="Online & sudah dibagikan">Online & sudah dibagikan</label><label><input type="radio" name="st" value="Jadi, belum dibagikan">Jadi, belum dibagikan</label><label><input type="radio" name="st" value="Belum selesai">Belum selesai</label></div></div>
    <div class="card"><label class="q" for="paling">Bagian yang paling membantu</label><textarea id="paling" data-n="Paling membantu"></textarea></div>
    <div class="card"><label class="q" for="saran">Yang perlu diperbaiki</label><textarea id="saran" data-n="Saran perbaikan"></textarea></div>
    <div class="card"><label class="q" for="lanjut">Mau belajar apa berikutnya?</label><div class="opts" data-n="Minat lanjut"><label><input type="checkbox" value="App">App</label><label><input type="checkbox" value="Website">Website</label><label><input type="checkbox" value="Video">Video</label><label><input type="checkbox" value="Carousel">Carousel</label><label><input type="checkbox" value="Jual jasa">Jual jasa</label><label><input type="checkbox" value="Upgrade paket">Upgrade paket</label></div></div>
    <div class="card"><label class="q" for="testi">Testimoni singkat (1–2 kalimat, boleh dikosongkan)</label><textarea id="testi" data-n="Testimoni"></textarea>
      <span class="q" style="margin-top:12px">Boleh ditampilkan di LP / medsos?</span><div class="opts" data-n="Izin tampil"><label><input type="radio" name="iz" value="Ya, dengan nama depan">Ya, dengan nama depan</label><label><input type="radio" name="iz" value="Ya, tanpa nama">Ya, tanpa nama</label><label><input type="radio" name="iz" value="Tidak">Tidak</label></div></div>
  </form>
</div>
<div class="bar"><div class="in"><button class="b2" onclick="window.print()">Cetak</button><button class="wa" id="kirim">Kirim ke WhatsApp</button></div></div>
<script>
(function(){
  var WA='6285704973827';
  var P=['Materi sesuai bidangku','Aku yang mengetik sendiri saat praktik','Penjelasan mudah dipahami','Karya jadi di akhir sesi','Tempat / Zoom nyaman','Durasi sesi pas','Alat & bonus paket bermanfaat'];
  document.getElementById('sk').innerHTML=P.map(function(p,i){return '<div class="card"><span class="q">'+p+'</span><div class="skala" data-n="'+p+'">'+[1,2,3,4,5].map(function(n){return '<label><input type="radio" name="s'+i+'" value="'+n+'">'+n+'</label>'}).join('')+'</div><div class="ends"><span>Sangat kurang</span><span>Sangat baik</span></div></div>'}).join('');
  var h='';for(var n=0;n<=10;n++)h+='<label><input type="radio" name="nps" value="'+n+'">'+n+'</label>';document.getElementById('nps').innerHTML=h;document.getElementById('nps').dataset.n='Rekomendasi (0-10)';
  document.getElementById('kirim').onclick=function(){
    var out=['*Evaluasi Mentoring Claude Jember*','• Nama: '+(document.getElementById('nama').value||'-')];
    [].forEach.call(document.querySelectorAll('[data-n]'),function(el){var v=el.tagName==='TEXTAREA'?el.value.trim():[].filter.call(el.querySelectorAll('input'),function(i){return i.checked}).map(function(i){return i.value}).join(', ');if(v)out.push('• '+el.dataset.n+': '+v)});
    window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(out.join('\n')),'_blank')};
})();
</script>
</body>
</html>
