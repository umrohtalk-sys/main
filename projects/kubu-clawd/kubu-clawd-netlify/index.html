<style>

  .paper { width: min(620px, 100%); max-height: 100%; overflow: auto; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; padding: clamp(14px, 4vw, 24px); display: flex; flex-direction: column; gap: 12px; box-shadow: 6px 6px 0 rgba(46,38,32,.85); animation: drop .42s cubic-bezier(.2,1.4,.4,1); position: relative; }

    taruh: function (t, x, y) { startPlace(t); if (!G.place) return false; if (x !== undefined) { G.place.x = x; G.place.y = y; } var n = S.b.length; confirmPlace(); if (G.place && G.place.t === 'tembok') cancelPlace(); return S.b.length > n; },
    selesai: function () { S.b.forEach(function (b) { if (b.bz) b.bz.end = now(); }); S.obs.forEach(function (o) { if (o.bz) o.bz.end = now(); }); econ(0); return window.__game.info.bangunan; },
    pilih: function (t) { var b = S.b.filter(function (x) { return x.t === t; })[0]; if (b) select('b', b.id); return !!b; },
    tingkatkan: function (t) { var b = S.b.filter(function (x) { return x.t === t && !x.bz; })[0]; if (!b) return false; var lv = b.lv; startUpgrade(b); return !!b.bz || b.lv > lv; },
    latih: function (t, n) { var k = 0; for (var i = 0; i < n; i++) if (train(t)) k++; return k; },
    pasukanInstan: function (t, n) { S.army[t] = (S.army[t] || 0) + n; },
    serang: function (i) { startBattle({ name: tx(CAMPAIGN[i]), level: i + 1, seed: 1000 + i * 77, camp: i, lootE: S.camp[i].le, lootT: S.camp[i].lt }); return BT.total; },
    cari: function () { S.emas += 20 * th(); search(); return !!BT; },
    turun: function (t, x, y, n) { BT.sel = t; var k = 0; for (var i = 0; i < (n || 1); i++) if (deploy(t, x + (i % 3) * 0.3, y + Math.floor(i / 3) * 0.3)) k++; return k; },
    bolehTurun: function (x, y) { return canDeploy(x, y); },
    mantra: function (k, x, y) { startSpell(k, x, y); return !!G.q; },
    jawabUji: function (betul) { if (!G.q || G.q.q.done) return false; var b = [].filter.call(document.querySelectorAll('#opts button'), function (x) { return (+x.getAttribute('data-v') === G.q.q.ans) === !!betul; })[0]; if (b) answerQ(b); return !!b; },
    lanjut: function () { if (G.q && G.q.q.done) { finishQ(); return true; } return false; },
    akhiri: function () { endBattle(); }, pulang: function () { leaveBattle(false); return G.mode; },
    hasilTampil: function () { return !!document.querySelector('[data-uji=pulang]'); },
    peti: function () { var p = S.peti[0]; if (!p) { S.petiT = 0; econ(0.01); p = S.peti[0]; } if (p) openPeti(p); return !!G.q; },
    kumpul: function () { var n = 0; S.b.forEach(function (b) { if ((b.t === 'tambang' || b.t === 'pompa') && b.st >= 1) { collect(b); n++; } }); return n; },
    dbg: function () { return BT ? BT.troops.map(function (u) { var o = BT.b[u.tgt]; return [u.t, +u.x.toFixed(1), +u.y.toFixed(1), o ? o.t + '@' + o.x + ',' + o.y + (o.dead ? 'X' : '') : '-', u.path ? u.path.length : -1, u.pi, o ? +rectDist(u.x, u.y, o).toFixed(2) : -1].join(' '); }) : null; },
    kamera: function (x, y, z) { var p = P(x, y); cam.x = p[0]; cam.y = p[1]; if (z) cam.z = z; clampCam(); }
  };
